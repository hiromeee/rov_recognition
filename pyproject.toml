[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nedo-vision-baseline"
version = "0.1.0"
description = "Realtime HSV baseline with source abstraction"
requires-python = ">=3.10"
dependencies = [
  "opencv-python==4.10.0.84",
  "numpy==2.1.1",
  "PyYAML==6.0.2"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.3",
]
