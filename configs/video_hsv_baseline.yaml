source:
  kind: video
  width: 640
  height: 480
  fps: 30
  frames_limit: null
  video_path: "videos_production_environment/nedo_video2.mp4"

hsv:
  lower: [25, 75, 100]
  upper: [55, 255, 255]
  morphology_kernel: 5
  min_contour_area: 150
  min_diameter_px: 10   # 小さすぎるマーカーを除外（要調整）
  # min_circularity: 0.6  # 水中環境では真円度が低下するため無効化

runtime:
  display: True
  log_interval_frames: 30
  aggregation_strategy: "nearest_center"  # options: "nearest_center", "average", "leftmost", "rightmost", "largest"
  outlier_sigma: 3.0  # 深度外れ値除去（MADベース, 0で無効）
  outlier_min_samples: 3

camera:
  fov_x_deg: 80.0  # Blue Robotics CAM-USB-LOW-LIGHT-R1 公式仕様値
  fov_y_deg: 64.0  # Blue Robotics CAM-USB-LOW-LIGHT-R1 公式仕様値
  altitude_m: 1.5  # 機体から認識対象までの距離（高度）
  pitch_deg: 0.0   # ピッチ角（前後方向の傾き）
  roll_deg: 0.0    # ロール角（左右方向の傾き）
  marker_diameter_m: 0.07  # マーカー直径（7cm）
  marker_spacing_m: 0.5  # マーカー間隔（50cm）
  # calibration_file: configs/camera_calibration.yaml  # 実測キャリブデータが得られたら有効化
